           url('font/iAWriterDuoS-Regular.eot') format('embedded-opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #053345;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      flex-direction: column;
      font-family: 'iAWriterDuoS', monospace;
    }
    svg#logo {
      width: 300px;
      display: block;
      font-family: 'iAWriterDuoS';
    }
    .ink {
      fill: none;
      stroke: #999;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }
    .ink.active {
      stroke: #fff;
    }
    .trigger-link {
      display: inline-block;
      background: transparent;
      color: #fff;
      text-decoration: none;
      border:none;
      cursor: pointer;
      user-select: none;
    }
    .trigger-link:active, 
    .trigger-link:hover {

    }


    .text-reveal {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .text-reveal.active {
      clip-path: inset(0 0% 0 0);
    }
  </style>

  <script>
    const paths = document.querySelectorAll('.ink');
    const textElement = document.getElementById('txt');
    let animationTimer = null;
    let isAnimating = false;
    let hasStarted = false;

    function preparePaths() {
      paths.forEach(path => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length + ' ' + length;
        path.style.strokeDashoffset = length;
        path.style.transition = 'none';
        path.classList.remove('active');
      });
  // Reset text reveal
      textElement.classList.remove('active');
    }

    let index = 0;

    function animateNext() {
      if (index >= paths.length) {
        isAnimating = false;
    // Trigger text swipe reveal after all paths are done
        setTimeout(() => {
          textElement.classList.add('active');
        }, 100);
        return;
      }

      const path = paths[index];
      const length = path.getTotalLength();
      const duration = index === 0 ? 0.4 : 0.2;

      path.style.transition = `stroke-dashoffset ${duration}s ease-in-out`;
      path.classList.add('active');
      void path.offsetWidth;
      path.style.strokeDashoffset = '0';

      index++;
      animationTimer = setTimeout(animateNext, duration * 1000);
    }

    function startAnimation() {
      if (isAnimating || hasStarted) return;

      hasStarted = true;


  // Reset everything
      paths.forEach(path => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length + ' ' + length;
        path.style.strokeDashoffset = length;
        path.style.transition = 'none';
        path.classList.remove('active');
      });
      textElement.classList.remove('active');

      index = 0;
      isAnimating = true;
      setTimeout(animateNext, 100);
    }

    function resetAnimation() {
      if (animationTimer) {
        clearTimeout(animationTimer);
        animationTimer = null;
      }

      index = 0;
      isAnimating = false;
      hasStarted = false;

      paths.forEach(path => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = length + ' ' + length;
        path.style.strokeDashoffset = length;
        path.style.transition = 'none';
        path.classList.remove('active');
      });
      textElement.classList.remove('active');


      void document.body.offsetWidth;
    }

    preparePaths();

    document.getElementById('triggerBtn').addEventListener('click', function(e) {
      e.preventDefault();
      if (hasStarted && !isAnimating) {
        resetAnimation();
        setTimeout(startAnimation, 200);
      } else if (!hasStarted) {
        startAnimation();
      }
    });

    window.onload = function() {
      if (!hasStarted) {
        startAnimation();
      }
    };
  </script>
